<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 340" preserveAspectRatio="xMidYMid slice">
<defs>
  <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#1d2a86"/>
    <stop offset="0.45" stop-color="#3559d6"/>
    <stop offset="0.75" stop-color="#2aa3cc"/>
    <stop offset="1" stop-color="#57d6b4"/>
  </linearGradient>
  <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
    <stop offset="0" stop-color="#fde68a" stop-opacity="0.7"/>
    <stop offset="1" stop-color="#fde68a" stop-opacity="0"/>
  </radialGradient>
  <linearGradient id="sun" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#fff7cf"/>
    <stop offset="1" stop-color="#fdba4d"/>
  </linearGradient>
  <linearGradient id="track" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#f4622b"/>
    <stop offset="1" stop-color="#fb923c"/>
  </linearGradient>
</defs>
<rect width="800" height="340" fill="url(#sky)"/>

<!-- พระอาทิตย์ยามเช้า + แสงเรือง -->
<circle cx="690" cy="104" r="130" fill="url(#glow)"/>
<circle cx="690" cy="104" r="42" fill="url(#sun)"/>

<!-- เมฆบางๆ -->
<g fill="#fff" opacity="0.2">
  <ellipse cx="560" cy="58" rx="62" ry="11"/>
  <ellipse cx="596" cy="48" rx="38" ry="10"/>
  <ellipse cx="330" cy="92" rx="54" ry="9"/>
  <ellipse cx="356" cy="83" rx="30" ry="8"/>
  <ellipse cx="770" cy="188" rx="46" ry="8"/>
</g>

<!-- เนินเขา 3 ชั้น -->
<path d="M0 252 C100 214 200 232 300 246 S 520 214 640 236 S 760 242 800 230 L800 340 L0 340Z" fill="#1fa08f" opacity="0.85"/>
<path d="M0 286 C120 254 240 276 360 268 S 600 248 720 272 L800 266 L800 340 L0 340Z" fill="#128274"/>
<!-- ต้นไม้เล็กๆ บนเนิน -->
<g fill="#0c5f58">
  <rect x="88" y="252" width="4" height="14"/><circle cx="90" cy="246" r="11"/>
  <rect x="128" y="258" width="4" height="12"/><circle cx="130" cy="253" r="8"/>
  <rect x="628" y="243" width="4" height="14"/><circle cx="630" cy="237" r="11"/>
  <rect x="738" y="250" width="4" height="12"/><circle cx="740" cy="245" r="8"/>
</g>
<path d="M0 320 C160 302 300 314 460 308 S 700 298 800 308 L800 340 L0 340Z" fill="#0c5f58"/>

<!-- ลู่วิ่ง โค้งพาดจากซ้ายล่างขึ้นขวา -->
<path d="M0 312 C180 296 340 292 480 276 S 700 256 800 250 L800 274 C700 282 560 302 440 316 S 180 336 0 340Z" fill="url(#track)"/>
<path d="M0 327 C180 316 340 305 470 292 S 690 268 800 261" fill="none" stroke="#fff" stroke-opacity="0.65" stroke-width="2" stroke-dasharray="14 12"/>

<!-- นักวิ่ง (ซิลูเอตต์เส้นกลม) + เงา + เส้นความเร็ว — ขยับไปซ้าย ให้พ้นชิปวันที่ที่ลอยมุมขวาล่าง -->
<g transform="translate(-130 10)">
<ellipse cx="462" cy="292" rx="28" ry="4" fill="#000" opacity="0.2"/>
<g fill="none" stroke="#0f1d4d" stroke-width="8" stroke-linecap="round" stroke-linejoin="round">
  <path d="M478 224 L462 254" stroke-width="11"/>
  <path d="M476 228 L494 240 L504 226"/>
  <path d="M476 228 L460 236 L448 248"/>
  <path d="M462 254 L484 266 L478 288"/>
  <path d="M462 254 L444 272 L424 266"/>
</g>
<circle cx="486" cy="211" r="9.5" fill="#0f1d4d"/>
<g stroke="#fff" stroke-opacity="0.5" stroke-width="3" stroke-linecap="round">
  <path d="M396 234 L422 234"/>
  <path d="M384 248 L414 248"/>
  <path d="M400 262 L418 262"/>
</g>
</g>
</svg>
