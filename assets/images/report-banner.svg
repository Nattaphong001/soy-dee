<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 340" preserveAspectRatio="xMidYMid slice">
<defs>
  <linearGradient id="sky" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#1c2470"/>
    <stop offset="0.55" stop-color="#3b4fd0"/>
    <stop offset="1" stop-color="#14a89a"/>
  </linearGradient>
  <linearGradient id="bar" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#ffffff" stop-opacity="0.34"/>
    <stop offset="1" stop-color="#ffffff" stop-opacity="0.06"/>
  </linearGradient>
  <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
    <stop offset="0" stop-color="#5eead4" stop-opacity="0.5"/>
    <stop offset="1" stop-color="#5eead4" stop-opacity="0"/>
  </radialGradient>
</defs>
<rect width="800" height="340" fill="url(#sky)"/>
<circle cx="660" cy="90" r="150" fill="url(#glow)"/>

<!-- เส้นกริดบางๆ -->
<g stroke="#fff" stroke-opacity="0.10" stroke-width="1">
  <line x1="0" y1="120" x2="800" y2="120"/>
  <line x1="0" y1="180" x2="800" y2="180"/>
  <line x1="0" y1="240" x2="800" y2="240"/>
</g>

<!-- แท่งกราฟลอยเรียงขึ้น -->
<g fill="url(#bar)">
  <rect x="330" y="230" width="34" height="110" rx="8"/>
  <rect x="384" y="200" width="34" height="140" rx="8"/>
  <rect x="438" y="216" width="34" height="124" rx="8"/>
  <rect x="492" y="170" width="34" height="170" rx="8"/>
  <rect x="546" y="150" width="34" height="190" rx="8"/>
  <rect x="600" y="118" width="34" height="222" rx="8"/>
  <rect x="654" y="132" width="34" height="208" rx="8"/>
  <rect x="708" y="86" width="34" height="254" rx="8"/>
</g>

<!-- เส้นแนวโน้ม + จุด -->
<polyline points="347,208 401,176 455,194 509,146 563,128 617,96 671,110 725,64" fill="none" stroke="#fde68a" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" opacity="0.9"/>
<g fill="#fde68a">
  <circle cx="347" cy="208" r="5.5"/><circle cx="401" cy="176" r="5.5"/><circle cx="455" cy="194" r="5.5"/>
  <circle cx="509" cy="146" r="5.5"/><circle cx="563" cy="128" r="5.5"/><circle cx="617" cy="96" r="5.5"/>
  <circle cx="671" cy="110" r="5.5"/><circle cx="725" cy="64" r="5.5"/>
</g>
</svg>
