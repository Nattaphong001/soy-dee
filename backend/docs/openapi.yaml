openapi: 3.0.3
info:
  title: Soy-Dee API
  version: 1.0.0
  description: |
    Route inventory generated from internal/routes/router.go. Per-endpoint request/response
    body schemas are not yet specified (see uploads/API_SPEC.md and internal/dto) — fill them
    in per operation as the contract is formalised.
    Auth: `bearer` = JWT access token. `owner` = caller's mb_id must equal {id}, or caller is admin.
servers:
  - url: http://localhost:8080/api/v1
security:
  - bearer: []
tags: []
components:
  securitySchemes:
    bearer: { type: http, scheme: bearer, bearerFormat: JWT }
  schemas:
    Success:
      type: object
      properties:
        success: { type: boolean, example: true }
        data: {}
        message: { type: string }
    Error:
      type: object
      properties:
        success: { type: boolean, example: false }
        error:
          type: object
          properties:
            code:
              type: string
              enum: [VALIDATION_ERROR, INVALID_CREDENTIALS, TOKEN_EXPIRED, TOKEN_INVALID, UNAUTHORIZED, FORBIDDEN, NOT_FOUND, DUPLICATE_USERNAME, CONFLICT, DUPLICATE_NAME, UNPROCESSABLE_ENTITY, INTERNAL_ERROR, RATE_LIMITED]
            message: { type: string }
  responses:
    Ok:
      description: Success envelope
      content: { application/json: { schema: { $ref: '#/components/schemas/Success' } } }
    Err:
      description: Error envelope (400/401/403/404/409/422/429/500)
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
paths:
  /healthz:
    get:
      summary: Liveness + DB ping (served outside /api/v1)
      security: []
      servers: [{ url: http://localhost:8080 }]
      responses: { '200': { description: ok }, '503': { description: db unavailable } }
  /auth/login/member:
    post:
      tags: [Auth]
      summary: Member login
      security: []
      responses:
        '200': { $ref: '#/components/responses/Ok' }
        default: { $ref: '#/components/responses/Err' }
  /auth/login/admin:
