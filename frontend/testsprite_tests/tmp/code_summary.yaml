version: "2"
type: frontend
tech_stack:
  - HTML5
  - Vanilla CSS
  - Vanilla JavaScript (ES6, IIFE modules, no bundler)
  - Fetch API (window.SoyDeeAPI client, JWT stored in localStorage)
  - REST backend at http://localhost:8080/api/v1 (separate Go API project)
routes:
  - path: /index.html
    file: index.html
    auth_required: false
    description: Static landing/redirect page
  - path: /views/auth/welcome.html
    file: views/auth/welcome.html
    auth_required: false
    description: Splash/welcome screen, redirects to login
  - path: /views/auth/login.html
    file: views/auth/login.html
    auth_required: false
    description: Login page with member/admin role tabs
  - path: /views/auth/register.html
    file: views/auth/register.html
    auth_required: false
    description: Member registration (multi-step form incl. body stats)
  - path: /views/user/index.html
    file: views/user/index.html
    auth_required: true
    description: Member dashboard - health summary, BMR history, quick nav
  - path: /views/user/food-record.html
    file: views/user/food-record.html
    auth_required: true
    description: Member food record CRUD for a selected date
  - path: /views/user/activity-record.html
    file: views/user/activity-record.html
    auth_required: true
    description: Member physical activity record CRUD for a selected date
  - path: /views/user/sleep-record.html
    file: views/user/sleep-record.html
    auth_required: true
    description: Member sleep record CRUD + sleep evaluation for a selected date
  - path: /views/user/profile.html
    file: views/user/profile.html
    auth_required: true
    description: Member profile, body stats, avatar upload, password change, logout
  - path: /views/admin/admin.html
    file: views/admin/admin.html
    auth_required: true
    description: Admin panel - sidebar (>=768px) / tabs (mobile) for food categories, activity types, members (read-only), reports, system overview stats

features:
  - name: Welcome/Splash Redirect
    description: Landing screen that redirects unauthenticated users to login
    files:
      - views/auth/welcome.html
      - assets/js/pages/welcome.js
    entry_route: /views/auth/welcome.html
    user_interactions:
      - Land on splash screen
      - Get auto-redirected to login page
    api_calls: []
    auth_required: false

  - name: Member/Admin Login
    description: Role-tabbed login form (member vs admin) with client-side validation and JWT session storage
    files:
      - views/auth/login.html
      - assets/js/pages/login.js
      - assets/js/shared/api.js
    entry_route: /views/auth/login.html
    user_interactions:
      - Switch between "ผู้ใช้งานทั่วไป" (member) and "ผู้ดูแลระบบ" (admin) tabs
      - Fill username/email and password fields
      - Toggle password visibility
      - Submit form
      - See inline Thai validation error for empty/short (<6 char) password
      - See inline error for invalid credentials from API
      - Get redirected to member dashboard or admin panel on success
    api_calls:
      - method: POST
        endpoint: /auth/login/member
      - method: POST
        endpoint: /auth/login/admin
    auth_required: false

  - name: Member Registration
    description: New member sign-up including profile and body-stat fields, auto-login after registration
    files:
      - views/auth/register.html
      - assets/js/pages/register.js
    entry_route: /views/auth/register.html
    user_interactions:
      - Fill registration form (username, password, full name, gender, body stats, activity level)
      - Submit to create account
      - Get automatically logged in and redirected to member dashboard
    api_calls:
      - method: POST
        endpoint: /auth/register
      - method: POST
        endpoint: /auth/login/member
    auth_required: false

  - name: Member Dashboard
    description: Shows signed-in member's health summary, latest body stats, and BMR history
    files:
      - views/user/index.html
      - assets/js/pages/index.js
    entry_route: /views/user/index.html
    user_interactions:
      - View profile avatar/name
      - View dashboard health summary cards
      - View recent BMR history entries
      - Navigate to food/activity/sleep record pages
    api_calls:
      - method: GET
        endpoint: /members/{id}/profile
      - method: GET
        endpoint: /members/{id}/dashboard
      - method: GET
        endpoint: /members/{id}/body-stats/latest
      - method: GET
        endpoint: /members/{id}/bmr/history
    auth_required: true

  - name: Food Record Management
    description: Member logs/edits/deletes food entries for a selected date, picked from admin-defined food categories
    files:
      - views/user/food-record.html
      - assets/js/pages/food-record.js
    entry_route: /views/user/food-record.html
    user_interactions:
      - Pick a date
      - Add a new food record (category, amount, optional image)
      - Edit an existing food record
      - Delete a food record
    api_calls:
      - method: GET
        endpoint: /food-categories
      - method: GET
        endpoint: /members/{id}/food-records
      - method: POST
        endpoint: /members/{id}/food-records
      - method: PUT
        endpoint: /members/{id}/food-records/{recordId}
      - method: DELETE
        endpoint: /members/{id}/food-records/{recordId}
    auth_required: true

  - name: Activity Record Management
    description: Member logs/edits/deletes physical activity entries with duration for a selected date
    files:
      - views/user/activity-record.html
      - assets/js/pages/activity-record.js
    entry_route: /views/user/activity-record.html
    user_interactions:
      - Pick a date
      - Add a new activity record (activity type, duration)
      - Edit an existing activity record
      - Delete an activity record
    api_calls:
      - method: GET
        endpoint: /activities
      - method: GET
        endpoint: /members/{id}/activity-records
      - method: POST
        endpoint: /members/{id}/activity-records
      - method: PUT
        endpoint: /members/{id}/activity-records/{recordId}
      - method: DELETE
        endpoint: /members/{id}/activity-records/{recordId}
    auth_required: true

  - name: Sleep Record & Evaluation
    description: Member logs sleep time/duration for a selected date and sees a computed sleep-quality evaluation
    files:
      - views/user/sleep-record.html
      - assets/js/pages/sleep-record.js
    entry_route: /views/user/sleep-record.html
    user_interactions:
      - Pick a date
      - Add/edit a sleep record (sleep time, wake time)
      - View sleep evaluation result
      - Delete a sleep record
    api_calls:
      - method: GET
        endpoint: /members/{id}/sleep-records
      - method: POST
        endpoint: /members/{id}/sleep-records
      - method: PUT
        endpoint: /members/{id}/sleep-records/{recordId}
      - method: DELETE
        endpoint: /members/{id}/sleep-records/{recordId}
    auth_required: true

  - name: Member Profile & Body Stats
    description: View/edit profile info, update body stats (triggers BMR recalculation), upload avatar, change password, logout
    files:
      - views/user/profile.html
      - assets/js/pages/profile.js
    entry_route: /views/user/profile.html
    user_interactions:
      - Edit profile fields and save
      - Edit body stats (weight, height, activity level) and save
      - Upload a new avatar image
      - Change password
      - Click logout
    api_calls:
      - method: GET
        endpoint: /members/{id}/profile
      - method: GET
        endpoint: /members/{id}/body-stats/latest
      - method: PUT
        endpoint: /members/{id}/profile
      - method: POST
        endpoint: /members/{id}/body-stats
      - method: POST
        endpoint: /members/{id}/bmr/calculate
      - method: POST
        endpoint: /members/{id}/avatar
      - method: PUT
        endpoint: /members/{id}/password
      - method: POST
        endpoint: /auth/logout
    auth_required: true

  - name: Admin - Food Category Management
    description: Admin lists, searches, paginates, creates, edits, and deletes food categories (with traffic-light health criteria)
    files:
      - views/admin/admin.html
      - assets/js/pages/admin.js
    entry_route: /views/admin/admin.html
    user_interactions:
      - Switch to "ประเภทอาหาร" tab/sidebar item
      - Search by name
      - Paginate through list
      - Add a new food category (name, image, traffic-light criteria)
      - Edit an existing food category
      - Delete a food category
    api_calls:
      - method: GET
        endpoint: /admin/food-categories
      - method: POST
        endpoint: /admin/food-categories
      - method: PUT
        endpoint: /admin/food-categories/{id}
      - method: DELETE
        endpoint: /admin/food-categories/{id}
    auth_required: true

  - name: Admin - Activity Type Management
    description: Admin lists, searches, paginates, creates, edits, and deletes activity types
    files:
      - views/admin/admin.html
      - assets/js/pages/admin.js
    entry_route: /views/admin/admin.html
    user_interactions:
      - Switch to "ประเภทกิจกรรม" tab/sidebar item
      - Search by name
      - Paginate through list
      - Add a new activity type
      - Edit an existing activity type
      - Delete an activity type
    api_calls:
      - method: GET
        endpoint: /admin/activities
      - method: POST
        endpoint: /admin/activities
      - method: PUT
        endpoint: /admin/activities/{id}
      - method: DELETE
        endpoint: /admin/activities/{id}
    auth_required: true

  - name: Admin - Member List (read-only)
    description: Admin views member list and drills into a single member's detail; no create/edit/delete
    files:
      - views/admin/admin.html
      - assets/js/pages/admin.js
    entry_route: /views/admin/admin.html
    user_interactions:
      - Switch to "ข้อมูลสมาชิก" sidebar item
      - Search/paginate members
      - Open a member's detail view
    api_calls:
      - method: GET
        endpoint: /admin/members
      - method: GET
        endpoint: /admin/members/{id}
    auth_required: true

  - name: Admin - Reports
    description: Admin views aggregate reports (filters likely by date range/type)
    files:
      - views/admin/admin.html
      - assets/js/pages/admin.js
    entry_route: /views/admin/admin.html
    user_interactions:
      - Switch to "รายงาน" sidebar item
      - Apply report filters
      - View report results
    api_calls:
      - method: GET
        endpoint: /admin/reports
    auth_required: true

  - name: Admin - System Overview
    description: Admin dashboard stats (overview tab / default sidebar landing)
    files:
      - views/admin/admin.html
      - assets/js/pages/admin.js
    entry_route: /views/admin/admin.html
    user_interactions:
      - Land on "ภาพรวมระบบ" overview
      - View system-wide stat cards
    api_calls:
      - method: GET
        endpoint: /admin/stats
    auth_required: true

  - name: Logout
    description: Ends session (member or admin) and returns to login page
    files:
      - assets/js/shared/api.js
      - assets/js/pages/profile.js
      - assets/js/pages/admin.js
    entry_route: /views/user/profile.html
    user_interactions:
      - Click logout button
      - Confirm logout in dialog
      - Get redirected to login page with session cleared
    api_calls:
      - method: POST
        endpoint: /auth/logout
    auth_required: true

known_limitations:
  - issue: Previous TestSprite runs used member credentials (soydee_test01/Soydee123) for admin-login tests, since the test config only carries one shared credential pair. No admin account with that username existed, causing every admin-login test to fail and eventually trip backend rate limiting.
    location: system_data table, testsprite_tests/tmp/config.json
    impact: Fixed by creating a dedicated admin account (sys_username=soydee_test01, matching password) in the soydee DB. Admin login now verified working directly against the backend (POST /auth/login/admin returns 200). Admin-panel test coverage (sidebar nav, CRUD, reports) should now be reachable.
  - issue: Backend is a separate Go API project not present in this repository (only reachable at http://localhost:8080/api/v1)
    location: assets/js/shared/api.js
    impact: All API-calling features require the backend server to be running locally for tests to pass; failures may be backend-side rather than frontend bugs
  - issue: Admin panel (admin.html/admin.js/admin.css) was substantially reworked (new sidebar nav, table headers, pagination) and is currently uncommitted
    location: views/admin/admin.html, assets/js/pages/admin.js, assets/css/pages/admin.css
    impact: No prior automated test coverage exists for the new sidebar navigation, table pagination, or member-list read-only behavior
