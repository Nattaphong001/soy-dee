<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>soy dee - ดูแลสุขภาพในทุกๆ วัน</title>
    <link rel="stylesheet" href="/assets/css/shared/style.css">
    <link rel="stylesheet" href="/assets/css/pages/auth.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- Theme init: เหมือนหน้าอื่นๆ เป๊ะ ป้องกันหน้าจอกระพริบตอนโหลด -->
    <script>
        (function () {
            try {
                var saved = localStorage.getItem('theme');
                if (saved === 'dark') {
                    document.documentElement.classList.add('dark-theme');
                }
            } catch (e) {}
        })();
    </script>
    <script src="/assets/js/shared/api.js"></script>
    <script>
        // ถ้ามี session ค้างอยู่แล้ว เด้งเข้าแอปทันที ไม่ต้องรอ splash + ไปหน้า login ซ้ำ
        SoyDeeAPI.redirectIfLoggedIn();
    </script>
</head>
<body class="mobile-body">
    <div class="bg-blob-a" aria-hidden="true"></div>
    <div class="bg-blob-b" aria-hidden="true"></div>
    <div class="bg-dot-grid" aria-hidden="true"></div>

    <!--
        UI - Welcome (Splash)
        ----------------------------------------------------------------------
        โหลดเป็นหน้าแรกของแอป แสดงมาสคอต "กิ้งก่า" ตัวเดียวกับ Dashboard
        (ใช้ CSS art ล้วน re-use จาก style.css เพื่อความ consistent ของแบรนด์)
        พร้อมแถบโหลดที่วิ่งให้ครบพอดีกับเวลาที่ระบบ redirect ไปหน้า Login
        ดู logic การนับเวลา + การ redirect ที่ assets/js/welcome.js
    -->
    <div class="mobile-app welcome-app" id="welcomeApp">
        <section class="welcome-stage">

            <div class="welcome-gecko-wrap" aria-hidden="true">
                <div class="gecko male pose-flex facing-left welcome-gecko">
                    <div class="gecko-inner">
                        <div class="g-tail"></div>
                        <div class="g-body">
                            <div class="g-top"></div>
                            <div class="g-skirt"></div>
                        </div>
                        <div class="g-leg g-leg-back"></div>
                        <div class="g-leg g-leg-front"></div>
                        <div class="g-arm g-arm-back"></div>
                        <div class="g-arm g-arm-front"></div>
                        <div class="g-head">
                            <div class="g-eye g-eye-back"><span class="g-pupil"></span><span class="g-lash"></span></div>
                            <div class="g-eye g-eye-front"><span class="g-pupil"></span><span class="g-lash"></span></div>
                            <div class="g-nostril"></div>
                            <div class="g-smile"></div>
                        </div>
                    </div>
                </div>
                <div class="welcome-gecko-shadow" aria-hidden="true"></div>
            </div>

            <h1 class="welcome-title">soy dee</h1>
            <p class="welcome-tagline"><span data-i18n="tagline-line1">ดูแลสุขภาพในทุกๆ วัน</span><br><span data-i18n="tagline-line2">อย่างเข้าใจตัวเองมากขึ้น</span></p>

            <div class="welcome-loader" role="status" aria-live="polite">
                <div class="welcome-loader-track">
                    <div class="welcome-loader-fill" id="welcomeLoaderFill"></div>
                </div>
                <span class="welcome-loader-text" data-i18n="loader-text">กำลังเตรียมข้อมูลของคุณ…</span>
            </div>
        </section>
    </div>

    <script src="/assets/js/shared/i18n.js"></script>
    <script src="/assets/js/pages/welcome.js"></script>
</body>
</html>
