<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>บันทึกอาหาร - soy dee</title>
    <link rel="stylesheet" href="/assets/css/shared/style.css">
    <link rel="stylesheet" href="/assets/css/shared/nav.css">
    <!-- profile.css มีคอมโพเนนต์กลางที่ใช้ร่วมกัน (back-btn, page-title, header-spacer ฯลฯ)
         หน้านี้ดึงมาใช้ซ้ำแทนการก็อปโค้ดซ้ำ เหมือนหน้า activity-record / sleep-record -->
    <link rel="stylesheet" href="/assets/css/shared/profile.css">
    <link rel="stylesheet" href="/assets/css/shared/datepicker.css">
    <link rel="stylesheet" href="/assets/css/shared/record-ui.css">
    <link rel="stylesheet" href="/assets/css/pages/food-record.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- Theme init: เหมือนหน้าอื่นทุกประการ ป้องกันหน้าจอกระพริบตอนโหลด -->
    <script>
        (function () {
            try {
                var saved = localStorage.getItem('theme');
                if (saved === 'dark') {
                    document.documentElement.classList.add('dark-theme');
                }
            } catch (e) {}
        })();
    </script>
    <script src="/assets/js/shared/icons.js"></script>
    <script src="/assets/js/shared/api.js"></script>
    <script>
        SoyDeeAPI.guardMember();
    </script>
</head>
<body class="mobile-body">
    <div class="bg-blob-a" aria-hidden="true"></div>
    <div class="bg-blob-b" aria-hidden="true"></div>
    <div class="bg-dot-grid" aria-hidden="true"></div>

    <div class="mobile-app">

        <!-- หัวหน้า: ภาพอาหารเป็นพื้นหลัง (assets/images/food-banner.jpg) + แถวเลือกวันที่ -->
        <div class="top-section record-hero food-hero">
            <header class="app-header">
                <div class="hero-text">
                    <h1 class="page-title" data-i18n="page-title">บันทึกอาหาร</h1>
                    <p class="hero-sub" data-i18n="page-subtitle">จดสิ่งที่กิน แล้วดูสมดุลของวันจากสีสถานะ</p>
                </div>
            </header>

            <!-- แถวเลือกวันที่: ปุ่ม "วันนี้" แสดงเฉพาะตอนดูย้อนหลัง (JS สลับ hidden) + วันที่ชิดขวา -->
            <div class="date-picker-wrapper">
                <button class="edit-profile-btn today-btn" id="todayBtn" type="button" aria-label="กลับไปวันนี้" hidden>
                    <span class="icon-inline"><i data-icon="today"></i></span>
                    <span data-i18n="today-btn">วันนี้</span>
                </button>
                <div class="date-picker-pill" id="datePickerPill" role="button" tabindex="0" aria-label="เลือกวันที่บันทึก">
                    <span class="icon-calendar"><i data-icon="calendar"></i></span>
                    <span class="date-text" id="dateText">—</span>
                    <span class="icon-chevron">⌄</span>
                </div>
            </div>
        </div>

        <main class="app-content">

            <!-- 1. การ์ดสรุปสัดส่วนสีโภชนาการของวันนั้น -->
            <section class="summary-card">
                <div class="panel-header">
                    <div class="header-title">
                        <span class="icon-box green-box"><i data-icon="food"></i></span>
                        <span id="summaryTitleText">สรุปโภชนาการวันนี้</span>
                    </div>
                    <div class="summary-total" id="summaryTotal">ทั้งหมด 0 รายการ</div>
                </div>
                <div class="summary-bar is-empty" id="summaryBar" role="img" aria-label="สัดส่วนสถานะอาหารของวัน">
                    <span class="bar-seg seg-green" id="barGreen"></span>
                    <span class="bar-seg seg-yellow" id="barYellow"></span>
                    <span class="bar-seg seg-red" id="barRed"></span>
                </div>
                <div class="summary-lights" id="summaryLights">
                    <div class="light-chip light-green">
                        <span class="light-dot"></span>
                        <span class="light-count numeric" id="countGreen">0</span>
                        <span class="light-label" data-i18n="light-green">ดีต่อสุขภาพ</span>
                    </div>
                    <div class="light-chip light-yellow">
                        <span class="light-dot"></span>
                        <span class="light-count numeric" id="countYellow">0</span>
                        <span class="light-label" data-i18n="light-yellow">ทานพอดี</span>
                    </div>
                    <div class="light-chip light-red">
                        <span class="light-dot"></span>
                        <span class="light-count numeric" id="countRed">0</span>
                        <span class="light-label" data-i18n="light-red">ควรระวัง</span>
                    </div>
                </div>
                <p class="summary-insight" id="summaryInsight" hidden></p>
            </section>

            <!-- ==========================================================
                 2. รายการอาหารที่บันทึกแล้วของวันนี้
                 ========================================================== -->
            <section class="log-section">
                <div class="section-heading-row">
                    <h2 class="section-heading" data-i18n="section-heading-today-log">บันทึกของวันนี้</h2>
                    <span class="count-badge" id="logCountBadge">0 รายการ</span>
                </div>

                <div class="log-list" id="logList">
                    <!-- JS render รายการ .log-item หรือ .empty-state ที่นี่ -->
                </div>
            </section>

            <!-- เว้นระยะให้พ้นปุ่ม FAB ก่อนถึง bottom nav -->
            <div class="fab-spacer" aria-hidden="true"></div>
        </main>

        <!-- ปุ่มลอยเพิ่มรายการอาหาร: กึ่งกลางจอ เหนือ bottom nav -->
        <div class="fab-wrapper">
            <button class="fab-add-btn" id="fabAddBtn" type="button" aria-label="เพิ่มรายการอาหาร"><svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg></button>
        </div>

        <nav id="app-nav-bar" class="nav-pill-wrapper">
            <ul class="nav-pill-container" id="horizontalNav">
                <div class="nav-indicator" id="navIndicator"></div>
                <li><a href="index.html" class="nav-icon-item" data-target="home"><i data-icon="home"></i></a></li>
                <li><a href="food-record.html" class="nav-icon-item active" data-target="food"><i data-icon="food"></i></a></li>
                <li><a href="activity-record.html" class="nav-icon-item" data-target="activity"><i data-icon="activity"></i></a></li>
                <li><a href="sleep-record.html" class="nav-icon-item" data-target="sleep"><i data-icon="sleep"></i></a></li>
                <li><a class="nav-icon-item is-disabled" data-target="report" aria-disabled="true" aria-label="รายงาน (เร็วๆ นี้)"><i data-icon="report"></i></a></li>
            </ul>
        </nav>
    </div>

    <!-- ============== Modal: ดูรายละเอียดรายการอาหาร (แยกจากฟอร์มแก้ไข) ============== -->
    <div class="modal-overlay" id="foodDetailOverlay">
        <div class="detail-card" id="foodDetailCard" role="dialog" aria-modal="true" aria-labelledby="detailName">
            <div class="detail-photo">
                <span class="detail-photo-media" id="detailPhotoMedia"></span>
                <button type="button" class="detail-close" id="detailCloseBtn" aria-label="ปิด"><i data-icon="x"></i></button>
            </div>
            <div class="detail-body">
                <span class="cat-pill" id="detailCat"></span>
                <h2 class="detail-name" id="detailName"></h2>
                <div class="detail-grid">
                    <div class="detail-tile">
                        <span class="detail-tile-label" data-i18n="detail-meal">มื้ออาหาร</span>
                        <span class="detail-tile-value" id="detailMeal"></span>
                    </div>
                    <div class="detail-tile">
                        <span class="detail-tile-label" data-i18n="detail-time">เวลาที่กิน</span>
                        <span class="detail-tile-value numeric" id="detailTime"></span>
                    </div>
                    <div class="detail-tile">
                        <span class="detail-tile-label" data-i18n="detail-amount">ปริมาณ</span>
                        <span class="detail-tile-value" id="detailAmount"></span>
                    </div>
                    <div class="detail-tile">
                        <span class="detail-tile-label" data-i18n="detail-light">สถานะ</span>
                        <span class="detail-tile-value" id="detailLight"></span>
                    </div>
                </div>
            </div>
            <div class="detail-actions">
                <button type="button" class="detail-delete-btn" id="detailDeleteBtn"><i data-icon="trash"></i><span data-i18n="detail-delete">ลบ</span></button>
                <button type="button" class="detail-edit-btn" id="detailEditBtn"><i data-icon="edit"></i><span data-i18n="detail-edit">แก้ไขรายการ</span></button>
            </div>
        </div>
    </div>

    <!-- ============== Modal: เพิ่ม/แก้ไขรายการอาหาร ============== -->
    <div class="modal-overlay" id="foodModalOverlay">
        <div class="sheet-card" role="dialog" aria-modal="true" aria-labelledby="foodModalTitle">
            <h2 class="sheet-title" id="foodModalTitle" data-i18n="modal-title-add">เพิ่มรายการอาหาร</h2>

            <div class="sheet-body">
                <!-- แถวบน: รูปอาหาร (ซ้าย) + ชื่อ/ปริมาณ (ขวา) -->
                <div class="food-top-row">
                    <div class="food-photo-field">
                        <button type="button" class="food-photo-drop" id="foodPhotoBtn" aria-label="เพิ่มรูปภาพ">
                            <span class="food-photo-preview" id="foodPhotoPreview"></span>
                        </button>
                        <button type="button" class="food-photo-remove" id="foodPhotoRemoveBtn" hidden aria-label="ลบรูป"><i data-icon="x"></i></button>
                        <input type="file" id="foodPhotoInput" accept="image/*" hidden>
                    </div>
                    <div class="food-top-fields">
                        <label class="form-field">
                            <span class="form-label" data-i18n="label-food-name">ชื่ออาหาร</span>
                            <input type="text" class="form-input" id="foodNameInput" placeholder="เช่น ข้าวผัดกะเพรา" data-i18n-placeholder="placeholder-food-name" maxlength="100">
                        </label>
                        <label class="form-field">
                            <span class="form-label" data-i18n="label-amount">ปริมาณ</span>
                            <input type="text" class="form-input" id="foodAmountInput" placeholder="เช่น 1 จาน, 200 กรัม" data-i18n-placeholder="placeholder-amount" maxlength="50">
                        </label>
                    </div>
                </div>

                <div class="form-field">
                    <span class="form-label" data-i18n="label-meal">มื้ออาหาร</span>
                    <div class="meal-pill-group" id="mealPillGroup">
                        <button type="button" class="meal-pill" data-meal="1"><i data-icon="sunrise"></i><span data-i18n="meal-pill-1">เช้า</span></button>
                        <button type="button" class="meal-pill" data-meal="2"><i data-icon="sun"></i><span data-i18n="meal-pill-2">กลางวัน</span></button>
                        <button type="button" class="meal-pill" data-meal="3"><i data-icon="moon"></i><span data-i18n="meal-pill-3">เย็น</span></button>
                        <button type="button" class="meal-pill" data-meal="4"><i data-icon="snack"></i><span data-i18n="meal-pill-4">ว่าง</span></button>
                    </div>
                </div>

                <div class="form-field">
                    <span class="form-label" data-i18n="label-category">ประเภทอาหาร</span>
                    <div class="category-picker">
                        <button type="button" class="category-trigger" id="categoryTrigger" aria-expanded="false" aria-controls="categoryChipGroup">
                            <span class="category-trigger-value" id="categoryTriggerValue"></span>
                            <span class="category-trigger-caret" aria-hidden="true"></span>
                        </button>
                        <div class="category-chip-group" id="categoryChipGroup" hidden></div>
                    </div>
                </div>

                <label class="form-row-inline">
                    <span class="form-label" data-i18n="label-time">เวลาที่กิน</span>
                    <input type="time" class="form-input" id="foodTimeInput">
                </label>

                <div class="sheet-error" id="foodFormError" hidden></div>
            </div>

            <div class="sheet-actions sheet-actions-row">
                <button type="button" class="sheet-cancel-btn" id="foodCancelBtn" data-i18n="btn-cancel">ยกเลิก</button>
                <button type="button" class="save-btn" id="foodSaveBtn" data-i18n="save-btn">บันทึกรายการ</button>
            </div>
        </div>
    </div>

    <script src="/assets/js/shared/i18n.js"></script>
    <script src="/assets/js/shared/nav.js"></script>
    <script src="/assets/js/shared/app.js"></script>
    <script src="/assets/js/shared/datepicker.js"></script>
    <script src="/assets/js/pages/food-record.js"></script>
</body>
</html>
